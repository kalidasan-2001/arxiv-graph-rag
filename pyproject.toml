[project]
name = "arxiv-graph-rag"
version = "0.1.0"
description = "ArXiv Hybrid Graph-RAG Platform — backend foundation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "httpx>=0.27",
    "pymupdf>=1.24",
    "qdrant-client>=1.9",
    "sentence-transformers>=3.0",
    "neo4j>=5.24",
    "langgraph==0.2.76",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "evaluation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
